version: "3.9"

# SRD §1 Architecture: Postgres+pgvector system of record. Not yet wired
# into the orchestrator (which runs on SQLite in this slice — see
# services/orchestrator/src/store.rs's own module doc comment for why) —
# this is here so the persistence layer has somewhere to run when that work
# starts. `./migrations` mounts infra/migrations/, this directory's own
# target schema (17 files, kept in sync with the real, running SQLite
# schema in services/orchestrator/migrations/ as of Phase 3 gap-closing —
# see that directory's own file-by-file comments for the real source each
# one mirrors), auto-applied by Postgres on first container startup.
#
# Redis and MinIO were removed here (Phase 3 gap-closing): neither is
# wired into any real code path anywhere in this repo — no `redis`/S3 crate
# or npm package exists, and `engine.rs`/`evidence.rs` both explicitly
# self-document "not integrated"/"not wired" for these respectively. Add
# either back only alongside the real code that would actually use it, not
# as speculative infrastructure with nothing behind it.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiqa
      POSTGRES_PASSWORD: aiqa
      POSTGRES_DB: aiqa
    ports:
      - "5432:5432"
    volumes:
      - aiqa_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqa -d aiqa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aiqa_postgres_data:
