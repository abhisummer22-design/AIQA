[package]
name = "aiqa-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }
# The autopilot (`autopilot_runner.rs`) calls this service's own routes in process: `ServiceExt::oneshot` on the router,
# the way the API tests below do. Already in the tree through axum.
tower = { version = "0.4", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "json", "migrate"] }
sha2 = "0.11.0"
hmac = "0.13.0"
rand = "0.10.2"
hex = "0.4.3"
anyhow = "1.0.104"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Real Product Documentation content extraction (Test Case Generator) — a
# .docx is itself a zip archive; this reads it directly rather than
# shelling out to an external converter. See `doc_extract.rs`.
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Text-based PDFs are read directly too (a scanned, image-only PDF has no text
# to read and is reported as such). See `doc_extract.rs`.
pdf-extract = "0.7"
# OpenAPI documents are mostly YAML: `openapi_spec.rs` reads them with a real YAML reader (the simple one the tools use does not
# take a sequence written at the indentation of its key, block text or flow style). Only that module uses it.
serde_yaml = "0.9"

# Critical-finding remediation (Architecture Audit "PRIORITY 1" — executor
# isolation). No container runtime is available in this dev environment
# (docker/podman/wsl all absent, checked fresh — see executor.rs's
# `job_containment` module doc comment), so real process containment is
# built directly on the Win32 Job Object API instead: the entire process
# tree an executor spawns is guaranteed to die together, with hard
# process-count and memory ceilings, when the job handle closes. Windows
# target only — every other platform already has no executors wired at all
# (see executor_project_dir's Windows-only callers in main.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Phase 1 regression tests need a real, disposable SQLite file per test:
# the defects being pinned (WAL/busy-timeout config, transactional inserts,
# tenant-scoped queries, recovery) are all properties of the on-disk store,
# so an in-memory or shared database would not exercise them.
tempfile = "3"
# BE-9: structured-error tests must inspect the actual HTTP response body
# (JSON shape, code, message), not just the status code — that requires
# driving real requests through the real `axum::Router` in-process rather
# than calling handler functions directly. `tower`'s `ServiceExt::oneshot`
# is the standard way to do that; `http-body-util` reads the response body
# axum 0.7 hands back (already a transitive dependency of axum itself,
# added here only so this crate may `use` it directly).
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
# BE-14: the realtime stream is a real WebSocket upgrade, not a plain HTTP
# request/response — `tower::ServiceExt::oneshot` (above) can't drive one.
# These tests instead bind the real router to a real TCP listener and
# connect with an actual WS client, so a subscription test exercises the
# same upgrade/auth/multiplex path a browser would, not an internal
# broadcaster called directly. Both crates are already transitive
# dependencies of `axum`'s `ws` feature (see Cargo.lock) — nothing new is
# pulled into the dependency tree, they're only exposed for direct use here.
tokio-tungstenite = "0.24"
futures-util = "0.3"
