[package]
name = "aiqa-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "json", "migrate"] }
sha2 = "0.11.0"
rand = "0.10.2"
hex = "0.4.3"
anyhow = "1.0.104"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# Phase 1 regression tests need a real, disposable SQLite file per test:
# the defects being pinned (WAL/busy-timeout config, transactional inserts,
# tenant-scoped queries, recovery) are all properties of the on-disk store,
# so an in-memory or shared database would not exercise them.
tempfile = "3"
# BE-9: structured-error tests must inspect the actual HTTP response body
# (JSON shape, code, message), not just the status code — that requires
# driving real requests through the real `axum::Router` in-process rather
# than calling handler functions directly. `tower`'s `ServiceExt::oneshot`
# is the standard way to do that; `http-body-util` reads the response body
# axum 0.7 hands back (already a transitive dependency of axum itself,
# added here only so this crate may `use` it directly).
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
# BE-14: the realtime stream is a real WebSocket upgrade, not a plain HTTP
# request/response — `tower::ServiceExt::oneshot` (above) can't drive one.
# These tests instead bind the real router to a real TCP listener and
# connect with an actual WS client, so a subscription test exercises the
# same upgrade/auth/multiplex path a browser would, not an internal
# broadcaster called directly. Both crates are already transitive
# dependencies of `axum`'s `ws` feature (see Cargo.lock) — nothing new is
# pulled into the dependency tree, they're only exposed for direct use here.
tokio-tungstenite = "0.24"
futures-util = "0.3"
